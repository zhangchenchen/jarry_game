        ];

        let curStageIdx = 0, curSubQ = 0, timer, activeQs = [], audioCtx = null, stageAdvanceTimer = null;
        const SHARE_PAGE_URL = 'https://jarry-game.vercel.app/';
        const SHARE_TEXT = '我卡关了，快来帮我复活，一起逆袭翻盘。';
        const stageVideos = [
            'https://resource.flickai.io/1.mp4',
            'https://resource.flickai.io/2.mp4',
            'https://resource.flickai.io/3.mp4'
        ];
        window.__sfxLog = [];

        function getAudioContext() {
            if (!audioCtx) {
                const AudioContextClass = window.AudioContext || window.webkitAudioContext;
                if (!AudioContextClass) return null;
                audioCtx = new AudioContextClass();
            }
            return audioCtx;
        }

        function resumeAudioContext() {
            const ctx = getAudioContext();
            if (ctx && ctx.state === 'suspended') {
                ctx.resume().catch(() => {});
            }
            return ctx;
        }

        function playTone(startFreq, endFreq, duration, volume, type = 'sine', delay = 0) {
            const ctx = getAudioContext();
            if (!ctx || ctx.state !== 'running') return;

            const osc = ctx.createOscillator();
            const gain = ctx.createGain();
            const startAt = ctx.currentTime + delay;
            osc.type = type;
            osc.frequency.setValueAtTime(startFreq, startAt);
            osc.frequency.linearRampToValueAtTime(endFreq, startAt + duration);
            gain.gain.setValueAtTime(0.0001, startAt);
            gain.gain.exponentialRampToValueAtTime(volume, startAt + 0.01);
            gain.gain.exponentialRampToValueAtTime(0.0001, startAt + duration);
            osc.connect(gain);
            gain.connect(ctx.destination);
            osc.start(startAt);
            osc.stop(startAt + duration + 0.02);
        }

        function playSfx(name) {
            const ctx = getAudioContext();
            if (!ctx) return;
            if (ctx.state === 'suspended') {
                ctx.resume().then(() => playSfx(name)).catch(() => {});
                return;
            }
            if (ctx.state !== 'running') return;

            window.__sfxLog.push(name);
            if (window.__sfxLog.length > 20) {
                window.__sfxLog.shift();
            }

            if (name === 'tap') {
                playTone(820, 560, 0.06, 0.03, 'triangle');
            } else if (name === 'success') {
                playTone(520, 780, 0.12, 0.045, 'triangle');
                playTone(780, 980, 0.12, 0.03, 'triangle', 0.1);
            } else if (name === 'fail') {
                playTone(380, 180, 0.2, 0.05, 'sawtooth');
            } else if (name === 'gacha-start') {
                playTone(240, 520, 0.22, 0.04, 'sawtooth');
            } else if (name === 'gacha-stop') {
                playTone(660, 420, 0.08, 0.04, 'square');
            } else if (name === 'jackpot') {
                playTone(520, 840, 0.14, 0.05, 'triangle');
                playTone(840, 1180, 0.18, 0.04, 'triangle', 0.12);
                playTone(1180, 1480, 0.24, 0.03, 'triangle', 0.24);
            }
        }

        function switchUi(id) { 
            document.querySelectorAll('.scene').forEach(s => s.classList.remove('active-scene')); 
            document.getElementById(id).classList.add('active-scene'); 
        }

        function showStageModal(view) {
            document.getElementById('stage-modal').classList.add('modal-show');
            document.getElementById('stage-intro-view').classList.toggle('hidden-panel', view !== 'intro');
            document.getElementById('stage-quiz-view').classList.toggle('hidden-panel', view !== 'quiz');
        }

        function hideStageModal() {
            document.getElementById('stage-modal').classList.remove('modal-show');
        }

        function toggleAudioButton(show) {
            document.getElementById('audio-activate-btn').style.display = show ? 'block' : 'none';
        }

        function enableVideoAudio() {
            resumeAudioContext();
            const storyBgVideo = document.getElementById('story-bg-video');
            storyBgVideo.muted = false;
            storyBgVideo.volume = 1;
            if (!storyBgVideo.paused && !storyBgVideo.ended) {
                storyBgVideo.play().then(() => toggleAudioButton(false)).catch(() => toggleAudioButton(true));
            } else {
                toggleAudioButton(false);
            }
        }

        function bindAudioInteractions() {
            document.addEventListener('pointerdown', (event) => {
                enableVideoAudio();
                if (event.target.closest('button')) {
                    setTimeout(() => playSfx('tap'), 20);
                }
            }, { passive: true });
        }

        function renderStory() {
            const data = gameData[curStageIdx];
            
            const storyBgVideo = document.getElementById('story-bg-video');
            const sceneStory = document.getElementById('scene-story');
            const gradientOverlay = document.getElementById('story-gradient-overlay');
            let introShown = false;
            clearTimeout(stageAdvanceTimer);

            function showStageIntro() {
                if (introShown) return;
                introShown = true;
                storyBgVideo.pause();
                gradientOverlay.style.display = 'block';
                showStageModal('intro');
            }

            storyBgVideo.pause();
            storyBgVideo.onplay = null;
            storyBgVideo.onended = null;
            storyBgVideo.onloadedmetadata = null;
            storyBgVideo.onerror = null;
            storyBgVideo.currentTime = 0;
            storyBgVideo.src = stageVideos[curStageIdx];
            storyBgVideo.muted = false;
            storyBgVideo.volume = 1;
            storyBgVideo.onloadedmetadata = function() {
                storyBgVideo.play().catch(function() {
                    storyBgVideo.muted = true;
                    storyBgVideo.play().then(function() {
                        toggleAudioButton(true);
                    }).catch(function(){});
                });
            };
            storyBgVideo.onerror = function() {
                showStageIntro();
            };
            storyBgVideo.load();
            clearInterval(timer);
            curSubQ = 0;
            toggleAudioButton(false);
            hideStageModal();
            gradientOverlay.style.display = 'none';
            sceneStory.style.backgroundImage = 'none';
            sceneStory.style.backgroundColor = '#000';
            document.getElementById('modal-share').classList.remove('modal-show');
            document.getElementById('modal-final').classList.remove('modal-show');

            function checkVideoEnd() {
                if (introShown || storyBgVideo.paused || storyBgVideo.ended) return;
                if (storyBgVideo.duration && storyBgVideo.currentTime >= storyBgVideo.duration - 0.3) {
                    showStageIntro();
                    return;
                }
                requestAnimationFrame(checkVideoEnd);
            }

            storyBgVideo.onplay = function() {
                requestAnimationFrame(checkVideoEnd);
            };
            storyBgVideo.onended = function() {
                showStageIntro();
            };

            if (curStageIdx === 2) {
                activeQs = getRandomQuizzes(data.quizPool, 2);
                activeQs.push(data.bossQuiz);
            } else {
                activeQs = getRandomQuizzes(data.quizPool, 3);
            }

            document.getElementById('story-title').innerText = data.title;
            document.getElementById('story-dialog').innerHTML = data.dialog;
            document.getElementById('story-btn').innerText = data.btnText;
            switchUi('scene-story');
        }

        function openQuiz() {
            const data = gameData[curStageIdx];
            const q = activeQs[curSubQ];
            showStageModal('quiz');
            document.getElementById('quiz-level').innerText = data.title;
            
            const dots = document.querySelectorAll('.step-dot');
            dots.forEach((dot, i) => dot.className = i < curSubQ ? "w-3 h-3 rounded-full bg-green-500" : (i === curSubQ ? "w-3 h-3 rounded-full bg-yellow-400 animate-pulse" : "w-3 h-3 rounded-full bg-gray-600"));
            
            document.getElementById('question-text').innerText = `(${curSubQ+1}/3) ` + q.q;
            
            const box = document.getElementById('options-container'); 
            box.innerHTML = '';
            
            q.options.forEach((txt, i) => {
                const btn = document.createElement('button');
                btn.className = "w-full py-5 text-left px-6 rounded-xl bg-gray-800 border border-gray-600 text-white active:scale-95 transition-transform";
                if(curStageIdx === 2) {
                    btn.classList.add("text-center", "font-bold", "text-xl");
                }
                btn.innerText = txt;
                btn.onclick = () => submitAnswer(i, q.correct, btn);
                box.appendChild(btn);
            });
            startTimer();
        }

        function submitAnswer(selectedIdx, correctIdx, btnElement) {
            clearInterval(timer);
            document.getElementById('timer').classList.remove('danger-pulse');
            
            const allBtns = document.getElementById('options-container').querySelectorAll('button');
            allBtns.forEach(b => b.disabled = true);

            let isWin = (selectedIdx === correctIdx);

            if (curStageIdx === 2 && curSubQ === 2) {
                isWin = Math.random() < 0.45;
            }

            if(isWin) {
                playSfx('success');
                btnElement.classList.replace('bg-gray-800', 'bg-green-600');
                btnElement.classList.add('success-flash');
                setTimeout(() => { 
                    curSubQ++; 
                    if(curSubQ < 3) {
                        openQuiz(); 
                    } else { 
                        curSubQ = 0; 
                        runGacha(); 
                    } 
                }, 600);
            } else {
                playSfx('fail');
                btnElement.classList.replace('bg-gray-800', 'bg-red-600');
                btnElement.classList.add('shake-anim');
                document.getElementById('timer').style.background = "#ef4444";
                setTimeout(() => document.getElementById('modal-share').classList.add('modal-show'), 600);
            }
        }

        function startTimer() {
            let t = 100; const bar = document.getElementById('timer');
            document.getElementById('time-text').innerText = '10';
            bar.style.width = "100%"; bar.style.background = "#fbbf24"; bar.classList.remove('danger-pulse');
            clearInterval(timer);
            timer = setInterval(() => {
                t--; bar.style.width = t + "%"; document.getElementById('time-text').innerText = Math.ceil(t/10);
                if(t === 30) bar.classList.add('danger-pulse');
                if(t <= 0) { clearInterval(timer); document.getElementById('modal-share').classList.add('modal-show'); }
            }, 100);
        }

        function setGachaIcon(targetId, icon) {
            const target = document.getElementById(targetId);
            target.textContent = "";
            if(icon && typeof icon === 'object' && icon.src) {
                const image = document.createElement('img');
                image.className = 'gacha-icon';
                image.src = icon.src;
                image.alt = icon.alt || '';
                target.appendChild(image);
                return;
            }
            target.innerText = icon;
        }

        function runGacha() {
            const data = gameData[curStageIdx];
            clearTimeout(stageAdvanceTimer);
            clearInterval(timer);
            document.getElementById('modal-share').classList.remove('modal-show');
            document.getElementById('modal-final').classList.remove('modal-show');
            playSfx('gacha-start');
            ['target1','target2','target3'].forEach((id,i) => setGachaIcon(id, data.gacha.icons[i]));
            ['st1','st2','st3'].forEach(id => { const s = document.getElementById(id); s.style.transform = 'translateY(0)'; s.classList.add('spinning'); });
            ['sw1','sw2','sw3'].forEach(id => document.getElementById(id).classList.remove('winner'));
            switchUi('scene-gacha');
            
            document.getElementById('reward-1').innerText = "";
            document.getElementById('reward-2').innerText = "";
            document.getElementById('reward-3').innerText = "";
            document.getElementById('next-stage-btn').classList.add('hidden');

            setTimeout(() => stopSlot('st1','sw1','reward-1',`已获得：${data.gacha.texts[0]}`), 1500);
            setTimeout(() => stopSlot('st2','sw2','reward-2',`已获得：${data.gacha.texts[1]}`), 2500);
            setTimeout(() => { 
                stopSlot('st3','sw3','reward-3',`压轴奖励：${data.gacha.texts[2]}`); 
                playSfx('jackpot');
                
                const nextBtn = document.getElementById('next-stage-btn');
                if(curStageIdx === 2) {
                    nextBtn.classList.add('hidden');
                    setTimeout(() => document.getElementById('modal-final').classList.add('modal-show'), 700);
                } else {
                    nextBtn.innerText = "继续改命";
                    nextBtn.classList.add('hidden');
                    stageAdvanceTimer = setTimeout(() => {
                        nextStage();
                    }, 1800);
                }
            }, 3500);
        }

        function stopSlot(strip, slot, tid, txt) {
            playSfx('gacha-stop');
            const s = document.getElementById(strip); s.classList.remove('spinning'); s.style.transform = 'translateY(calc(-3 * min(27vw, 122px)))';
            document.getElementById(slot).classList.add('winner'); document.getElementById(tid).innerText = txt;
        }

        function nextStage() { 
            if(curStageIdx < 2) { 
                curStageIdx++; 
                renderStory(); 
            } else { 
                alert("即将为您跳转至真实的股票交易大厅..."); 
                location.reload(); 
            } 
        }

        function getShareData(platform) {
            const pageUrl = SHARE_PAGE_URL;
            const lineText = `${SHARE_TEXT}\n${pageUrl}`;

            const shareMap = {
                line: {
                    label: 'LINE',
                    appUrl: `line://msg/text/${encodeURIComponent(lineText)}`,
                    webUrl: `https://line.me/R/msg/text/?${encodeURIComponent(lineText)}`
                },
                facebook: {
                    label: 'Facebook',
                    appUrl: `fb://facewebmodal/f?href=${encodeURIComponent(`https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`)}`,
                    webUrl: `https://www.facebook.com/sharer/sharer.php?u=${encodeURIComponent(pageUrl)}`
                },
                twitter: {
                    label: 'Twitter',
                    appUrl: `twitter://post?message=${encodeURIComponent(`${SHARE_TEXT} ${pageUrl}`)}`,
                    webUrl: `https://twitter.com/intent/tweet?text=${encodeURIComponent(SHARE_TEXT)}&url=${encodeURIComponent(pageUrl)}`
                }
            };

            return shareMap[platform];
        }

        function shareRevive(platform) { 
            const data = getShareData(platform);
            const status = document.getElementById('share-status');
            status.innerText = `正在拉起 ${data.label}，如果未安装 App 会自动跳转到网页分享...`;

            const fallbackTimer = setTimeout(() => {
                if (document.visibilityState === 'visible') {
                    window.open(data.webUrl, '_blank');
                }
            }, 900);

            window.location.href = data.appUrl;

            setTimeout(() => {
                clearTimeout(fallbackTimer);
                document.getElementById('modal-share').classList.remove('modal-show'); 
                status.innerText = `${data.label} 已拉起，复活成功，继续挑战！`;
                openQuiz();
            }, 1200);
        }

        bindAudioInteractions();
        window.onload = renderStory;
    </script>
</body>
</html>
